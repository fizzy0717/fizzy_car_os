<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>FIZZY OS Maps</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    * { box-sizing:border-box; }
    html,body,#map { width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#e5edf4; }
    .leaflet-container { font-family:Arial,sans-serif;background:#e5edf4; }
    .leaflet-control-attribution { font-size:9px!important; }
    .user-dot { width:18px;height:18px;border-radius:50%;background:#2786e8;border:4px solid #fff;box-shadow:0 1px 8px rgba(0,0,0,.35); }
    .status { position:absolute;z-index:650;left:13px;bottom:13px;padding:8px 12px;border-radius:12px;background:rgba(250,253,255,.91);color:#33485d;font:12px Arial,sans-serif;box-shadow:0 2px 10px rgba(0,0,0,.13);max-width:75%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="status" id="status">Tap the map to open Google Maps</div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map', { zoomControl:true, attributionControl:true })
      .setView([3.1390,101.6869], 11);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom:19,
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    let userMarker = null;
    let userCircle = null;

    window.setDeviceLocation = function(lat,lon) {
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
      const position = [lat,lon];
      if (!userMarker) {
        const icon = L.divIcon({className:'',html:'<div class="user-dot"></div>',
          iconSize:[26,26],iconAnchor:[13,13]});
        userMarker = L.marker(position,{icon}).addTo(map).bindPopup('Your current location');
        userCircle = L.circle(position,{radius:35,color:'#2786e8',
          fillColor:'#2786e8',fillOpacity:.12,weight:1}).addTo(map);
        map.setView(position,15);
      } else {
        userMarker.setLatLng(position);
        userCircle.setLatLng(position);
      }
      document.getElementById('status').textContent = 'Your live current location';
    };

    map.on('click', function() {
      if (window.FizzyMaps && window.FizzyMaps.openGoogleMapsFromMap) {
        window.FizzyMaps.openGoogleMapsFromMap();
      }
    });

    map.whenReady(function() {
      setTimeout(function(){map.invalidateSize();},250);
    });
    window.addEventListener('resize',function(){map.invalidateSize();});
  </script>
</body>
</html>
